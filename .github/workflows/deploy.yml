# ---------------------------------------------------------
# GitHub Actions 自动化部署 Hugo 博客到 GitHub Pages 的工作流
# ---------------------------------------------------------

# 工作流的名称，会显示在 GitHub 仓库的 Actions 标签页中
name: Deploy Hugo site to Pages

# 触发工作流的事件配置
on:
  # 当发生代码推送（push）时触发此自动化脚本
  push:
    # 指定监听的分支
    branches:
      # 只有当推送到 main 分支时，才触发自动化构建与发布流程
      - main

# 设置运行此工作流所需的权限，确保安全性和 Pages 服务的正常调用
permissions:
  # 允许读取仓库中的源代码内容（用于后续步骤拉取博客源码）
  contents: read
  # 允许向 GitHub Pages 服务写入数据（用于将编译好的网页发布上线）
  pages: write
  # 允许获取安全的身份令牌（GitHub Pages 部署所需的 OpenID Connect 凭证验证）
  id-token: write

# 并发控制：防止多个部署任务同时运行导致线上内容冲突
concurrency:
  # 将此并发组命名为 "pages"
  group: "pages"
  # 如果有新的部署任务进入，是否取消当前正在运行的任务（false 表示不取消旧任务，采用排队等待机制）
  cancel-in-progress: false

# 定义具体要执行的一系列任务（Jobs）
jobs:
  # 定义一个名为 deploy（部署）的任务
  deploy:
    # 指定运行该任务的目标线上环境
    environment:
      # 环境名称设置为官方标准的 GitHub Pages 部署环境名
      name: github-pages
      # 部署成功后，在 Actions 页面动态显示的实际网站预览 URL
      url: ${{ steps.deployment.outputs.page_url }}
    # 指定执行任务的虚拟服务器操作系统（这里采用最新的 Ubuntu 稳定版 Linux 虚拟机）
    runs-on: ubuntu-latest
    # 任务中具体包含的顺序执行步骤（Steps）
    steps:
      
      # 步骤 1：从仓库拉取你的博客源代码
      - name: Checkout
        # 使用官方推出的代码切出/拉取组件（版本 V4）
        uses: actions/checkout@v4
        # 附加的细化配置参数
        with:
          # 递归拉取 Git 子模块（因为 PaperMod 等主题是作为 Git 子模块引入的，必须开启此项才能拉到主题文件）
          submodules: recursive
          # 拉取 Git 历史记录的深度（0 代表拉取全部历史。Hugo 很多主题需要完整的 Git 历史来正确计算文章的更新时间）
          fetch-depth: 0

      # 步骤 2：在虚拟机中安装并配置 Hugo 环境
      - name: Setup Hugo
        # 使用第三方维护、官方推荐的 Hugo 安装组件（版本 V3）
        uses: peaceiris/actions-hugo@v3
        # 附加的细化配置参数
        with:
          # 自动下载并安装最新稳定版的 Hugo 编译引擎
          hugo-version: 'latest'
          # 是否启用 Extended（扩展版）。必须为 true，因为 PaperMod 等现代主题普遍使用 Sass/SCSS 编写样式，只有扩展版支持编译
          extended: true

      # 步骤 3：使用 Hugo 命令编译生成静态网页文件
      - name: Build with Hugo
        # 在 Ubuntu 虚拟机的终端直接执行的构建命令
        # --minify 参数表示对生成的 HTML、CSS、JS 进行压缩去空格混淆，极大地优化网站加载速度
        run: hugo --minify

      # 步骤 4：将编译出来的静态网页文件打包并作为产物（Artifact）上传到 GitHub 暂存区
      - name: Upload artifact
        # 使用官方的 Pages 产物打包上传组件（版本 V3）
        uses: actions/upload-pages-artifact@v3
        # 附加的细化配置参数
        with:
          # 指定需要打包哪个文件夹。Hugo 默认编译输出的静态网站内容全部存放在项目根目录下的 public 文件夹中
          path: ./public

      # 步骤 5：将暂存区的产物正式发布到 GitHub Pages 服务器上，实现上线
      - name: Deploy to GitHub Pages
        # 给这个步骤设置一个唯一的 ID 标识，以便在上面 environment.url 中能够通过变量引用它的输出结果
        id: deployment
        # 使用官方的 Pages 最终发布组件（版本 V4）
        uses: actions/deploy-pages@v4