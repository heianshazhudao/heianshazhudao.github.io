baseURL = 'https://example.org/'
locale = 'en-us'
title = 'My New Hugo Project'
theme = 'PaperMod'


# ---------------------------------------------------------
# Hugo 核心分类法映射配置 (Taxonomies Configuration)
# ---------------------------------------------------------
[taxonomies]
    # 映射标签：左边 tag 是 Hugo 核心引擎认的名称，右边 "tags" 是生成的 URL 路径（即路径会变成 /tags/）
    tag = "tags"
    # 映射分类：左边 category 是引擎名称，右边 "categories" 是生成的 URL 路径（即 /categories/）
    category = "categories"


# ---------------------------------------------------------
# Hugo PaperMod 主题独有参数配置 (Theme Params)
# ---------------------------------------------------------
[params]
    # 是否在文章的页脚或顶部显示该文章被打上的标签（true 代表显示，方便读者点击过滤）
    ShowPostNavLinks = true
    # 是否在文章详情页中显示分类和标签的图标与文字（true 代表显示）
    ShowCodeCopyButtons = true


# ---------------------------------------------------------
# Hugo 核心导航菜单配置 (Menu Configuration)
# ---------------------------------------------------------

# 声明一个属于顶部主导航栏（main）的菜单项：归档
[[menu.main]]
    # 菜单项上显示的文本名称
    name = "归档"
    # 点击该菜单后跳转的相对路径（对应刚才创建的 content/archives.md）
    url = "/archives/"
    # 菜单项在导航栏里的排列顺序（数字越小越靠左）
    weight = 10

# 示例：顺便顺手配一个标签页菜单（PaperMod 自带支持）
[[menu.main]]
    # 菜单项上显示的文本名称
    name = "标签"
    # 点击后跳转到全站标签聚集地
    url = "/tags/"
    # 排列顺序（数字比归档大，所以会排在归档的右边）
    weight = 20

# ---------------------------------------------------------
# Hugo 导航菜单追加 - 关于页面
# ---------------------------------------------------------
[[menu.main]]
    # 导航栏按钮上显示的文本名称
    name = "关于"
    # 点击该菜单后跳转的路径（对应上面创建的 content/about.md）
    url = "/about/"
    # 菜单项在导航栏里的排列顺序（数字 30 会排在“标签”的更右侧）
    weight = 30

# ---------------------------------------------------------
# Hugo 渲染安全策略配置（允许在 Markdown 中内嵌原生 HTML）
# ---------------------------------------------------------
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      # 【核心修复项】开启 unsafe 渲染！
      # 设置为 true 后，Hugo 才会放行 Markdown 里的 <div>、<h3>、<a> 等原生 HTML 标签。
      # 这样你设计的双栏卡片才能正常渲染出来，彻底告别空白页！
      unsafe = true